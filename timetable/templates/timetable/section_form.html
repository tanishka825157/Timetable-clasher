{% extends 'timetable/base.html' %}{% block content %}<h1 class="h3 mb-3">Schedule a section</h1><div class="card"><div class="card-body"><form method="post" hx-post="{% url 'timetable:live_check' %}" hx-trigger="change from:select, keyup changed delay:400ms from:input[name=semester]" hx-target="#clash-status" hx-swap="innerHTML">{% csrf_token %}{% for field in form %}<div class="mb-3">{{ field.label_tag }}{{ field }}{% for error in field.errors %}<div class="text-danger">{{ error }}</div>{% endfor %}</div>{% endfor %}<div id="clash-status"></div><button class="btn btn-primary" type="submit" formaction="{% url 'timetable:section_create' %}" hx-boost="false">Save section</button></form></div></div>{% endblock %}
