<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · College Timetable</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container py-5" style="max-width: 460px"><div class="card shadow-sm"><div class="card-body p-4"><h1 class="h3 mb-3">College Timetable</h1><p class="text-muted">Sign in to manage schedules.</p><form method="post">{% csrf_token %}{% if form.errors %}<div class="alert alert-danger">Your username or password was not recognised.</div>{% endif %}<div class="mb-3"><label class="form-label" for="id_username">Username</label><input class="form-control" id="id_username" name="username" autofocus required></div><div class="mb-3"><label class="form-label" for="id_password">Password</label><input class="form-control" type="password" id="id_password" name="password" required></div><input type="hidden" name="next" value="{{ next }}"><button class="btn btn-primary w-100">Sign in</button></form></div></div></main></body></html>
